spring.application.name=bookmyhive
server.port=8080

# ---- MySQL (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD) ----
spring.datasource.url=jdbc:mysql://localhost:3306/bookmyhive?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=${JWT_SECRET:bookmyhive-super-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Seed demo data on first start ----
app.seed.enabled=true

# ---- TMDB API (The Movie Database) ----
# Set your TMDB API v3 Key (32 hex characters) or v4 Read Access Token here (or via TMDB_API_KEY environment variable)
tmdb.api.key=187fb0494d2197883226203dde3e197c
tmdb.api.url=https://api.themoviedb.org/3
tmdb.image.base-url=https://image.tmdb.org/t/p
tmdb.region=IN
tmdb.sync.on-startup=true
